# Builds the "PARKER TEST" APK of a work branch, so the Owner can try it before it goes live.
# It runs on this device's own copy (no server) and installs next to the real PARKER app.
# Nothing is published: the APK is attached to the run as a download (kept 14 days).
name: Test APK
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: npm ci
      - name: Build the site in test mode
        run: npx tsc -b && npx vite build --mode demo
      - name: Copy it into the Android app
        run: CAP_BUNDLED=1 npx cap sync android
      - name: Build the APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleTrial --no-daemon
      - name: Name it
        run: |
          mkdir out
          cp android/app/build/outputs/apk/trial/*.apk "out/PARKER-TEST-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PARKER-TEST-apk
          path: out/*.apk
          retention-days: 14
      # Also put the APK alone on a download branch (approved by the Owner, 28 Nov 2026), so it can be fetched with plain git.
      - name: Put the APK on the download branch
        run: |
          cd out
          git init -q -b apk
          git add *.apk
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Test APK from ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk:claude/project-thread-nq4u8y
